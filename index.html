<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Курочка Ряба — интерактивная сказка</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color:#3a2e22;
    background:radial-gradient(circle at 50% 0%,#fff9ee 0%,#f3e5cb 55%,#e7d3b0 100%);
    display:flex;flex-direction:column;
    user-select:none;touch-action:manipulation;
  }
  #app{flex:1;display:flex;flex-direction:column;
    width:100%;max-width:1080px;margin:0 auto;
    padding:10px 16px 14px;min-height:0}
  .hud{display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:2px 4px 10px;flex-shrink:0}
  .hud-right{display:flex;align-items:center;gap:14px}
  .brand{font-family:Georgia,'Times New Roman',serif;
    font-size:clamp(15px,2vw,19px);letter-spacing:.04em;color:#8a6a44;white-space:nowrap}
  .brand b{color:#b8372a;font-weight:600}
  .dots{display:flex;gap:7px;align-items:center}
  .dot{width:7px;height:7px;border-radius:50%;background:#dcc8a6;
    box-shadow:inset 0 1px 1px rgba(0,0,0,.1);
    transition:background .35s,transform .35s,box-shadow .35s}
  .dot.done{background:#c9a06a}
  .dot.active{background:#c0392b;transform:scale(1.6);box-shadow:0 0 8px rgba(192,57,43,.5)}

  .icon-btn{
    width:36px;height:36px;border-radius:50%;border:0;
    background:rgba(255,255,255,.55);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:#8a6a44;
    transition:background .2s,color .2s,transform .15s;
    box-shadow:0 1px 3px rgba(90,60,30,.12),inset 0 0 0 1px rgba(160,120,70,.2);
  }
  .icon-btn:hover{background:rgba(255,255,255,.9);color:#5a4028}
  .icon-btn:active{transform:scale(.93)}
  .icon-btn.muted{color:#b8372a;background:rgba(255,235,225,.85)}

  .stage{flex:1;min-height:0;position:relative;
    border-radius:22px;overflow:hidden;
    background:linear-gradient(180deg,#a8d8ea 0%,#f4ecd8 70%,#cfe0ac 100%);
    box-shadow:0 12px 34px rgba(90,60,30,.18),
               inset 0 0 0 1px rgba(160,120,70,.25),
               inset 0 0 0 6px rgba(255,255,255,.55);
    transition:opacity .26s ease}
  .scene-svg{width:100%;height:100%;display:block}

  .caption{font-family:Georgia,'Times New Roman',serif;
    font-size:clamp(16px,2.5vw,23px);line-height:1.42;text-align:center;color:#4a3a28;
    padding:14px 12px 4px;max-width:780px;margin:0 auto;
    min-height:calc(1.42em * 2 + 18px);
    text-shadow:0 1px 0 rgba(255,255,255,.6);
    transition:opacity .25s ease}
  .hint{text-align:center;font-size:14px;letter-spacing:.02em;
    color:#9a7f5c;min-height:20px;padding-bottom:2px;
    animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

  .overlay{position:fixed;inset:0;z-index:50;display:flex;
    align-items:center;justify-content:center;padding:22px;
    background:rgba(58,44,28,.42);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    transition:opacity .35s ease,visibility .35s}
  .overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}

  .card{background:linear-gradient(165deg,#fffefb 0%,#fdf6e6 100%);
    border-radius:28px;padding:clamp(28px,5vw,50px) clamp(26px,5vw,56px);
    max-width:540px;width:100%;text-align:center;
    box-shadow:0 28px 80px rgba(60,40,20,.38),
               0 0 0 1px rgba(190,150,100,.4),
               0 0 0 10px rgba(255,255,255,.35),
               inset 0 1px 0 rgba(255,255,255,.9);
    animation:cardIn .45s cubic-bezier(.2,1.2,.4,1)}
  @keyframes cardIn{from{transform:translateY(18px) scale(.96);opacity:0}to{transform:none;opacity:1}}
  .card h1{font-family:Georgia,'Times New Roman',serif;
    font-size:clamp(28px,5vw,42px);font-weight:600;
    color:#8f2f22;letter-spacing:.01em;line-height:1.15}
  .card .sub{margin-top:10px;font-size:clamp(14px,2.2vw,17px);
    color:#8a7255;line-height:1.5}
  .card .rule{width:64px;height:3px;border-radius:2px;margin:18px auto;
    background:linear-gradient(90deg,transparent,#d9b477,transparent)}

  .btn{font:inherit;font-weight:600;font-size:clamp(16px,2.4vw,19px);
    padding:16px 46px;margin-top:26px;border:0;border-radius:999px;
    color:#fff;cursor:pointer;letter-spacing:.02em;
    background:linear-gradient(180deg,#e05243 0%,#b8372a 50%,#9a2a1e 100%);
    box-shadow:0 6px 0 #8a2316,0 14px 28px rgba(150,45,25,.32),
               inset 0 1px 0 rgba(255,255,255,.3);
    transition:transform .1s ease,box-shadow .1s ease,background .2s}
  .btn:hover{background:linear-gradient(180deg,#e85a4b 0%,#c03e30 50%,#a22f22 100%)}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8a2316,0 6px 14px rgba(150,45,25,.3),
               inset 0 1px 0 rgba(255,255,255,.3)}
  .btn:focus-visible{outline:3px solid #e8b84b;outline-offset:3px}

  .audio-status{font-size:12px;color:#a89575;margin-top:14px;min-height:14px;letter-spacing:.01em;line-height:1.5}

  .mini-hen{display:block;margin:0 auto 4px;width:110px;height:130px}
  .hintring{pointer-events:none;transform-box:fill-box;transform-origin:center;
    animation:ringPulse 1.9s ease-out infinite}
  @keyframes ringPulse{0%{transform:scale(.86);opacity:.85}70%{transform:scale(1.22);opacity:0}100%{transform:scale(1.22);opacity:0}}
  .tears{transition:opacity .6s ease}

  @media (max-width:520px){
    #app{padding:8px 10px 10px}
    .stage{border-radius:16px}
    .caption{padding-top:10px}
    .mini-hen{width:88px;height:104px}
    .hud-right{gap:10px}
  }
  @media (max-height:560px){
    .caption{font-size:15px;min-height:0;padding:8px 10px 2px}
    .hint{font-size:12px}
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="goldGrad" x1="0.2" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.28" stop-color="#f8d060"/>
      <stop offset="0.62" stop-color="#dfa32c"/>
      <stop offset="1" stop-color="#b2770f"/>
    </linearGradient>
    <linearGradient id="plainGrad" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f6eee0"/>
      <stop offset="1" stop-color="#d6cab2"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffeaa8" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#ffd977" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd977" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>

<div id="app">
  <div class="hud">
    <div class="brand">Курочка <b>Ряба</b></div>
    <div class="hud-right">
      <button class="icon-btn" id="muteBtn" aria-label="Звук вкл/выкл" title="Звук вкл/выкл"></button>
      <div class="dots" id="dots"></div>
    </div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="caption" id="caption"></div>
  <div class="hint" id="hint"></div>
</div>

<div class="overlay" id="startOverlay">
  <div class="card">
    <svg class="mini-hen" viewBox="-55 -125 110 135" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
    <h1>Курочка Ряба</h1>
    <p class="sub">Интерактивная сказка для самых маленьких.<br>Нажимайте на героев и предметы, чтобы сказка ожила.</p>
    <div class="rule"></div>
    <button class="btn" id="startBtn">Начать сказку</button>
    <div class="audio-status" id="audioStatus"></div>
  </div>
</div>

<div class="overlay hidden" id="endOverlay">
  <div class="card">
    <h1>Тут и сказке конец</h1>
    <p class="sub">А кто слушал — молодец!<br>Курочка Ряба снова снесла простое яичко,<br>и все остались довольны.</p>
    <div class="rule"></div>
    <button class="btn" id="againBtn">Ещё раз</button>
  </div>
</div>

<script>
/* ============================================================
   ОЗВУЧКА — просто положите файлы рядом с index.html
   (или в подпапку audio/ или sound/).
   Игра при запуске сама найдёт их по имени.
   Поддерживаются расширения: mp3, wav, ogg, m4a.
   Если файл не найден — включится синтез.
   ============================================================ */
const AUDIO_DIRS = ['', 'audio/', 'sound/'];
const AUDIO_EXTS = ['mp3', 'wav', 'ogg', 'm4a'];
const NARRATION_VOL = 0.95;
const EFFECTS_VOL   = 0.85;

const AUDIO_KEYS = [
  'narration-1','narration-2','narration-3','narration-4','narration-5','narration-6','narration-7',
  'cluck','knock','sparkle','crash','squeak','sad','happy','pop','clink','whoosh'
];

/* найденные URL: key -> строка | null */
const detectedUrls = {};
let audioProbeDone = false;

/* ---------- состояние звука ---------- */
let muted = false;
let currentNarration = null;
try { muted = localStorage.getItem('ryaba-muted') === '1'; } catch(e){}

/* ---------- пробинг: параллельно пробуем все варианты, резолвим на первом успехе ---------- */
function buildUrls(key){
  const urls = [];
  for(const dir of AUDIO_DIRS){
    for(const ext of AUDIO_EXTS){
      urls.push(`${dir}${key}.${ext}`);
    }
  }
  return urls;
}

function probeAudio(urls){
  return new Promise(resolve => {
    let remaining = urls.length;
    let settled = false;
    const audios = [];

    function abortAll(){
      for(const a of audios){
        try {
          a.oncanplaythrough = null;
          a.onerror = null;
          a.removeAttribute('src');
          a.load();
        } catch(e){}
      }
    }

    for(const url of urls){
      const a = new Audio();
      audios.push(a);
      let done = false;

      const settle = (ok) => {
        if(done) return;
        done = true;
        a.oncanplaythrough = null;
        a.onerror = null;

        if(settled) return;

        if(ok){
          settled = true;
          abortAll();
          resolve(url);
        } else {
          remaining--;
          if(remaining === 0){
            settled = true;
            resolve(null);
          }
        }
      };

      a.preload = 'auto';
      a.oncanplaythrough = () => settle(true);
      a.onerror = () => settle(false);

      try { a.src = url; a.load(); }
      catch(e){ settle(false); continue; }

      setTimeout(() => settle(false), 2500);
    }
  });
}

let audioProbePromise = null;
function initAudioProbe(){
  audioProbePromise = Promise.all(
    AUDIO_KEYS.map(async key => {
      detectedUrls[key] = await probeAudio(buildUrls(key));
    })
  ).then(() => {
    audioProbeDone = true;
    updateAudioIndicator();
    logAudioSummary();
  });
  return audioProbePromise;
}

function logAudioSummary(){
  const found = {}, missing = [];
  for(const key of AUDIO_KEYS){
    if(detectedUrls[key]) found[key] = detectedUrls[key];
    else missing.push(key);
  }
  console.group('[Курочка Ряба] Проверка звуков');
  if(Object.keys(found).length){
    console.log('✓ Найдены файлы:');
    for(const [k,v] of Object.entries(found)) console.log('  ', k, '→', v);
  }
  if(missing.length){
    console.warn('✗ Не найдены (будет синтез):', missing.join(', '));
  }
  console.groupEnd();
}

function updateAudioIndicator(){
  const el = document.getElementById('audioStatus');
  if(!el) return;
  const total = AUDIO_KEYS.length;
  const found = Object.values(detectedUrls).filter(Boolean).length;
  if(found === 0){
    el.textContent = 'Звуковые файлы не найдены — используется встроенный синтез. Проверьте имена и папку (см. консоль F12).';
    el.style.color = '#b5734a';
  } else if(found === total){
    el.textContent = `Найдены все ${total} звуковых файлов`;
    el.style.color = '#8a6a44';
  } else {
    el.textContent = `Найдено звуковых файлов: ${found} из ${total}`;
    el.style.color = '#8a6a44';
  }
}

/* ---------- воспроизведение ---------- */
function stopNarration(){
  if(currentNarration){
    try { currentNarration.pause(); currentNarration.currentTime = 0; } catch(e){}
    currentNarration = null;
  }
}
function duckNarration(){
  if(!currentNarration) return;
  const a = currentNarration;
  a.volume = NARRATION_VOL * 0.3;
  setTimeout(() => {
    if(currentNarration === a) a.volume = NARRATION_VOL;
  }, 550);
}
async function playNarration(i){
  stopNarration();
  if(muted) return;

  // если проба ещё не завершена — подождём немного
  if(!audioProbeDone && detectedUrls['narration-1'] === undefined){
    try { await Promise.race([audioProbePromise, new Promise(r => setTimeout(r, 1800))]); } catch(e){}
  }
  if(muted) return;
  if(current !== i) return;

  const url = detectedUrls['narration-' + (i + 1)];
  if(!url){
    console.warn(`[Курочка Ряба] narration-${i + 1}: файл не найден`);
    return;
  }
  const a = new Audio(url);
  a.volume = NARRATION_VOL;
  currentNarration = a;
  const p = a.play();
  if(p && p.catch) p.catch(err => {
    console.warn(`[Курочка Ряба] Не удалось воспроизвести narration-${i + 1}:`, err.message);
    if(currentNarration === a) currentNarration = null;
  });
}
function playFile(key){
  if(muted) return true;
  const url = detectedUrls[key];
  if(!url) return false;
  const a = new Audio(url);
  a.volume = EFFECTS_VOL;
  const p = a.play();
  if(p && p.catch) p.catch(()=>{});
  duckNarration();
  return true;
}

/* ---------- кнопка звука ---------- */
const ICON_ON = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`;
const ICON_OFF = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/></svg>`;

function updateMuteBtn(){
  const btn = document.getElementById('muteBtn');
  if(!btn) return;
  btn.innerHTML = muted ? ICON_OFF : ICON_ON;
  btn.classList.toggle('muted', muted);
  btn.setAttribute('aria-label', muted ? 'Включить звук' : 'Выключить звук');
  btn.setAttribute('title', muted ? 'Звук выключен' : 'Звук включён');
}
function setMuted(m){
  muted = m;
  try { localStorage.setItem('ryaba-muted', m ? '1' : '0'); } catch(e){}
  updateMuteBtn();
  if(muted) stopNarration();
}

/* ============================================================
   СИНТЕЗ — запасной звук
   ============================================================ */
let AC = null;
function actx(){
  if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
  if(AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type='sine', vol=0.12, when=0, slideTo=null){
  if(muted) return;
  const c = actx(), t = c.currentTime + when;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
function noiseBurst(dur=0.2, vol=0.2, freq=1200, q=1, when=0){
  if(muted) return;
  const c = actx(), t = c.currentTime + when;
  const len = Math.max(1, Math.floor(c.sampleRate * dur));
  const buf = c.createBuffer(1, len, c.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2);
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type='bandpass';
  f.frequency.value = freq; f.Q.value = q;
  const g = c.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(c.destination);
  src.start(t);
}

const S = {
  cluck(){ if(playFile('cluck')) return;
    tone(780,0.09,'square',0.055,0,470); tone(700,0.09,'square',0.045,0.13,400);
    noiseBurst(0.05,0.035,2400,3); },
  sparkle(){ if(playFile('sparkle')) return;
    [1046,1318,1568,2093].forEach((f,i)=> tone(f,0.38,'sine',0.065,i*0.07)); },
  pop(){ if(playFile('pop')) return; tone(480,0.14,'sine',0.1,0,940); },
  knock(){ if(playFile('knock')) return;
    noiseBurst(0.11,0.26,250,0.8); tone(150,0.12,'sine',0.14,0,68); },
  clink(){ if(playFile('clink')) return;
    tone(2150,0.26,'triangle',0.045); tone(3250,0.2,'sine',0.028); },
  crash(){ if(playFile('crash')) return;
    noiseBurst(0.45,0.28,2500,0.6); noiseBurst(0.3,0.2,720,0.9,0.04);
    tone(340,0.3,'triangle',0.09,0,130); },
  squeak(){ if(playFile('squeak')) return;
    tone(1500,0.08,'sine',0.06,0,2150); tone(1700,0.06,'sine',0.05,0.11,2350); },
  sad(){ if(playFile('sad')) return;
    tone(392,0.55,'sine',0.075,0); tone(330,0.65,'sine',0.075,0.26);
    tone(262,0.75,'sine',0.07,0.52); },
  happy(){ if(playFile('happy')) return;
    [523,659,784,1046,1318].forEach((f,i)=> tone(f,0.42,'triangle',0.085,i*0.1)); },
  whoosh(){ if(playFile('whoosh')) return; noiseBurst(0.35,0.06,1600,0.7); }
};

/* ============================== АНИМАЦИИ ============================== */
const easeOut   = p => 1 - Math.pow(1-p, 3);
const easeIn    = p => p*p;
const easeInOut = p => p < .5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2;
function anim(dur, step, done){
  const t0 = performance.now();
  function frame(now){
    const p = Math.min(1, (now - t0)/dur);
    step(p);
    if(p < 1) requestAnimationFrame(frame);
    else if(done) done();
  }
  requestAnimationFrame(frame);
}
const SVGNS = 'http://www.w3.org/2000/svg';

function burst(root, x, y, color='#ffe08a', count=8, radius=28){
  const g = document.createElementNS(SVGNS, 'g');
  let s = '';
  for(let i=0;i<count;i++){
    const a = (i/count)*Math.PI*2;
    s += `<line x1="${x+Math.cos(a)*11}" y1="${y+Math.sin(a)*11}"
                x2="${x+Math.cos(a)*radius}" y2="${y+Math.sin(a)*radius}"
                stroke="${color}" stroke-width="4" stroke-linecap="round"/>`;
  }
  g.innerHTML = s;
  g.setAttribute('pointer-events','none');
  root.appendChild(g);
  anim(440, p => {
    const k = 0.45 + easeOut(p)*1.05;
    g.setAttribute('transform', `translate(${x},${y}) scale(${k}) translate(${-x},${-y})`);
    g.style.opacity = String(1 - p);
  }, () => g.remove());
}
function shellParticles(root, x, y){
  for(let i=0;i<7;i++){
    const el = document.createElementNS(SVGNS, 'path');
    el.setAttribute('d', 'M0,0 l7,-5 l3,6 z');
    el.setAttribute('fill', '#f6efdf');
    el.setAttribute('stroke', '#d8ccb4');
    el.setAttribute('stroke-width', '1');
    el.setAttribute('pointer-events','none');
    root.appendChild(el);
    const ang = -Math.PI/2 + (Math.random()-0.5)*2.2;
    const dist = 46 + Math.random()*46;
    anim(620, p => {
      const e = easeOut(p);
      const dx = Math.cos(ang)*dist*e;
      const dy = Math.sin(ang)*dist*e + 120*p*p;
      el.setAttribute('transform', `translate(${x+dx},${y+dy}) rotate(${p*420})`);
      el.style.opacity = String(1 - p*p);
    }, () => el.remove());
  }
}
function wobble(el, amp=7, dur=420){
  anim(dur, p => {
    const a = Math.sin(p*Math.PI*5) * amp * (1-p);
    el.setAttribute('transform', `rotate(${a})`);
  }, () => el.setAttribute('transform',''));
}

/* ============================== ХЕЛПЕРЫ ============================== */
function place(x, y, art, o = {}){
  const s  = (o.s === undefined) ? 1 : o.s;
  const id = o.id ? ` id="${o.id}"` : '';

/* ============================== ДВИЖОК ============================== */
const scenes = [scene1, scene2, scene3, scene4, scene5, scene6, scene7];
const stageEl   = document.getElementById('stage');
const captionEl = document.getElementById('caption');
const hintEl    = document.getElementById('hint');
const dotsEl    = document.getElementById('dots');
const startOv   = document.getElementById('startOverlay');
const endOv     = document.getElementById('endOverlay');

let current = 0;
scenes.forEach(() => {
  const d = document.createElement('div');
  d.className = 'dot';
  dotsEl.appendChild(d);
});
const dotEls = [...dotsEl.children];

function updateDots(){
  dotEls.forEach((d, i) => {
    d.className = 'dot' + (i === current ? ' active' : i < current ? ' done' : '');
  });
}

function render(i){
  const sc = scenes[i]();
  current = i;

  stageEl.innerHTML =
    `<svg class="scene-svg" viewBox="0 0 800 480"
          preserveAspectRatio="xMidYMid meet"
          xmlns="http://www.w3.org/2000/svg">${sc.html}</svg>`;

  captionEl.textContent = sc.text;
  hintEl.textContent = sc.hint || '';
  hintEl.style.visibility = sc.hint ? 'visible' : 'hidden';
  updateDots();

  setTimeout(() => {
    if(current === i) playNarration(i);
  }, 350);

  const svg = stageEl.querySelector('svg');
  sc.init(svg, () => goTo(i + 1));
}

function goTo(i){
  if(i >= scenes.length){ finish(); return; }
  stageEl.style.opacity = '0';
  captionEl.style.opacity = '0';
  hintEl.style.opacity = '0';
  setTimeout(() => {
    render(i);
    stageEl.style.opacity = '1';
    captionEl.style.opacity = '1';
    hintEl.style.opacity = '1';
  }, 270);
}

function finish(){
  current = scenes.length - 1;
  updateDots();
  dotEls.forEach(d => { d.className = 'dot done'; });
  stopNarration();
  endOv.classList.remove('hidden');
}

function startGame(){
  try { actx(); } catch(e){}
  stopNarration();
  startOv.classList.add('hidden');
  endOv.classList.add('hidden');
  stageEl.style.opacity = '1';
  captionEl.style.opacity = '1';
  hintEl.style.opacity = '1';
  render(0);
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', startGame);
document.getElementById('muteBtn').addEventListener('click', () => setMuted(!muted));

document.querySelector('.mini-hen').innerHTML = hen();

stageEl.style.transition   = 'opacity .26s ease';
captionEl.style.transition = 'opacity .26s ease';
hintEl.style.transition    = 'opacity .26s ease';
hintEl.style.visibility = 'hidden';

updateMuteBtn();
initAudioProbe();
</script>
</body>
</html>
